<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kiddotasks — Kids Station (iOS frame)</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>body { display: grid; place-items: center; padding: 20px; }</style>
</head>
<body>
  <div class="iphone-stage" id="shot">
    <div class="caption">
      <div class="caption-brand">
        <img src="/Users/arjayresurreccion/projects/GitHub/kiddoTasks/apps/web/public/brand-logo.png" alt="" />
        <div>
          <div class="name">KiddoTasks</div>
          <div class="sub">Kids Station</div>
        </div>
      </div>
      <h2>Missions kids can finish</h2>
      <p>No kid email. Open with the family PIN on iPad or iPhone.</p>
    </div>
    <div class="iphone">
      <div class="iphone-screen">
        <div class="ios-status"><span>9:41</span><span>▮▮▮ ⚡</span></div>
        <div class="ios-app">
          <div style="display:flex;align-items:center;gap:0.65rem;min-height:72px;margin-bottom:0.35rem;">
            <span class="chip-ghost" style="border-radius:999px;">Parent</span>
            <div class="arz sm" aria-hidden="true"></div>
            <h1 style="flex:1;min-width:0;font-size:1.25rem;font-weight:800;letter-spacing:-0.02em;">Hi, Maya!</h1>
          </div>

          <div class="kids-hero" style="background:#3978A8;">
            <div class="row">
              <div class="child-avatar" style="width:56px;height:56px;background:#ffffff55;font-size:28px;box-shadow:none;">👧</div>
              <div style="flex:1;min-width:0;">
                <div class="eyebrow">Missions</div>
                <h3>Hi, Maya!</h3>
              </div>
              <div class="stars">★ 42</div>
            </div>
          </div>

          <p style="font-size:0.72rem;font-weight:800;letter-spacing:0.08em;color:var(--color-text-tertiary);margin-bottom:0.45rem;text-transform:uppercase;">Today’s missions</p>

          <div class="mission">
            <div class="icon-tile" style="width:48px;height:48px;background:#3978A8;font-size:22px;">🛏️</div>
            <div class="meta">
              <div class="name">Make the bed</div>
              <div class="sub">🛏️ Ready</div>
            </div>
            <span class="pill surface">★ 5</span>
          </div>
          <div class="mission">
            <div class="icon-tile" style="width:48px;height:48px;background:#8B99A8;font-size:22px;">🐾</div>
            <div class="meta">
              <div class="name">Feed the dog</div>
              <div class="sub">🐾 Ready</div>
            </div>
            <span class="pill surface">★ 8</span>
          </div>
          <div class="mission">
            <div class="icon-tile" style="width:48px;height:48px;background:#6F9FBD;font-size:22px;">📚</div>
            <div class="meta">
              <div class="name">Reading 20 min</div>
              <div class="sub">📚 Ready</div>
            </div>
            <span class="pill surface">★ 10</span>
          </div>
          <div class="mission">
            <div class="icon-tile" style="width:48px;height:48px;background:#3978A8;font-size:22px;">📦</div>
            <div class="meta">
              <div class="name">Put toys away</div>
              <div class="sub">📦 Ready</div>
            </div>
            <span class="pill surface">★ 6</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
